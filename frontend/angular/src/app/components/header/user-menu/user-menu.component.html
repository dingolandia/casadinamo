<div *ngIf="!isLogged">
  
  <button mat-stroked-button color="white" routerLink="perfil">
    Perfil de usuário
  </button>

  <button mat-stroked-button color="white" (click)="openDialogLogin()">
    Login
  </button>
  <button mat-stroked-button color="white" (click)="openDialogSignup()">
    Cadastro
  </button>
</div>
<div *ngIf="isLogged">
  <span>Perfil usuário logado</span>
  <a routerLink="." queryParamsHandling="preserve" role="button" (click)="logout()">LOGOUT</a>
</div>
